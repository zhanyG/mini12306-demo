spring.application.name=demo
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mini12306?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
